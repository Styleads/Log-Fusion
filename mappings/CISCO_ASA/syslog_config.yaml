# Mapping config: Cisco Adaptive Security Appliance (ASA)
# Format: Syslog
# Purpose: Generic Cisco ASA -> OCSF normalization

source_identity:
  vendor: "Cisco"
  product: "Adaptive Security Appliance"
  format: "syslog"
  version: "1.0"

# ---- detection ----
# Recognizes Cisco ASA Syslog messages by their standard
# facility/severity/message-id structure.
detection:
  method: "regex"
  pattern: '^%ASA-\d+-\d{6}:'

# ---- parsing ----
parsing:
  format: "syslog"

  header:
    pattern: '^(?<timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{4}\s+\d{2}:\d{2}:\d{2}):\s+%ASA-(?<severity>\d+)-(?<message_id>\d+):'

    fields:
      timestamp: raw_timestamp
      severity: raw_severity
      message_id: raw_message_id

  body:
    target: raw_message

# ---- message families ----
# Cisco ASA has many message IDs, so parsing is organized
# by message family rather than by individual sample records.

message_families:

  connection:
    message_ids:
      - "302013"
      - "302014"
      - "302015"
      - "302016"
      - "302017"

    fields:
      protocol: raw_protocol
      connection_id: raw_connection_id
      src_ip: raw_src_ip
      src_port: raw_src_port
      src_zone: raw_src_zone
      dst_ip: raw_dst_ip
      dst_port: raw_dst_port
      dst_zone: raw_dst_zone
      duration: raw_duration
      bytes: raw_bytes
      end_reason: raw_end_reason

  access_control:
    message_ids:
      - "106001"
      - "106002"
      - "106003"
      - "106006"
      - "106007"
      - "106014"
      - "106015"
      - "106016"
      - "106017"
      - "106018"
      - "106019"
      - "106020"
      - "106021"
      - "106022"
      - "106023"

    fields:
      protocol: raw_protocol
      src_ip: raw_src_ip
      src_port: raw_src_port
      src_zone: raw_src_zone
      dst_ip: raw_dst_ip
      dst_port: raw_dst_port
      dst_zone: raw_dst_zone
      access_group: raw_access_group
      rule: raw_rule

  nat:
    message_ids:
      - "305011"
      - "305012"
      - "305013"
      - "305014"
      - "305015"
      - "305016"

    fields:
      protocol: raw_protocol
      original_src_ip: raw_original_src_ip
      original_src_port: raw_original_src_port
      original_src_zone: raw_original_src_zone
      translated_src_ip: raw_translated_src_ip
      translated_src_port: raw_translated_src_port
      translated_src_zone: raw_translated_src_zone
      original_dst_ip: raw_original_dst_ip
      original_dst_port: raw_original_dst_port
      translated_dst_ip: raw_translated_dst_ip
      translated_dst_port: raw_translated_dst_port

  authentication:
    message_ids:
      - "113001"
      - "113002"
      - "113003"
      - "113004"
      - "113005"

    fields:
      username: raw_username
      authentication_method: raw_authentication_method
      source_ip: raw_auth_source_ip
      destination_ip: raw_auth_destination_ip
      result: raw_auth_result

# ---- classification ----
classification:

  default_class_uid: 4001
  default_class_name: "Network Activity"

  rules:

    connection_open:
      when:
        message_family: "connection"
        event_action: "open"

      activity_name: "Open"

    connection_close:
      when:
        message_family: "connection"
        event_action: "close"

      activity_name: "Close"

    access_denied:
      when:
        message_family: "access_control"
        event_action: "deny"

      activity_name: "Refuse"

    nat_translation:
      when:
        message_family: "nat"
        event_action: "translate"

      activity_name: "Open"

    authentication:
      when:
        message_family: "authentication"

      class_name: "Authentication"
      activity_name: "Authenticate"

# ---- field_map ----
# Source-independent OCSF-oriented normalized representation.

field_map:

  raw_src_ip:
    "src_endpoint.ip"

  raw_src_port:
    "src_endpoint.port"

  raw_src_zone:
    "src_endpoint.zone"

  raw_dst_ip:
    "dst_endpoint.ip"

  raw_dst_port:
    "dst_endpoint.port"

  raw_dst_zone:
    "dst_endpoint.zone"

  raw_protocol:
    "connection_info.protocol_name"

  raw_connection_id:
    "connection_info.uid"

  raw_duration:
    "connection_info.duration"

  raw_end_reason:
    "connection_info.end_reason"

  raw_bytes:
    "traffic.bytes"

  raw_access_group:
    "policy.name"

  raw_username:
    "actor.user.name"

  raw_authentication_method:
    "authentication.type"

  raw_auth_source_ip:
    "src_endpoint.ip"

  raw_auth_destination_ip:
    "dst_endpoint.ip"

# ---- static fields ----
static_fields:

  "device.vendor_name": "Cisco"
  "device.type": "Firewall"

  "metadata.product.vendor_name": "Cisco"
  "metadata.product.name": "Adaptive Security Appliance"

# ---- transforms ----
transforms:

  raw_severity:
    type: "integer"

  raw_message_id:
    type: "integer"

  raw_src_port:
    type: "integer"

  raw_dst_port:
    type: "integer"

  raw_connection_id:
    type: "integer"

  raw_bytes:
    type: "integer"

  raw_duration:
    type: "duration"

  raw_protocol:
    type: "passthrough_upper"

# ---- timestamp ----
timestamp:
  source_field: "raw_timestamp"
  format: "%b %d %Y %H:%M:%S"
  timezone: "local"

# ---- unmapped fields ----
# Any ASA fields for which the current OCSF mapping does not
# have a corresponding destination are preserved here.

unmapped_policy:
  action: "bucket"
  target: "unmapped"

# ---- raw preservation ----
# Always preserve the original Cisco ASA Syslog message.

raw_preservation:
  enabled: true
  target_field: "raw_data"
