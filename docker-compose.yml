services:
  # -------------------------------------------------------------
  # 1. OpenSearch Database Engine
  # -------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: ulpf-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 2. OpenSearch Storage API (FastAPI)
  # -------------------------------------------------------------
  storage-api:
    build:
      context: ./database
    image: ulpf-storage-api:latest
    container_name: ulpf-storage-api
    depends_on:
      - opensearch
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_INDEX=ulpf-events
    ports:
      - "8000:8000"
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 3. Log Normalization Engine API & CLI (FastAPI)
  # -------------------------------------------------------------
  engine:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: ulpf-engine:latest
    container_name: ulpf-engine-api
    depends_on:
      - storage-api
      - ollama
    environment:
      - STORAGE_API_URL=http://storage-api:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHATBOT_FORCE_OLLAMA=${CHATBOT_FORCE_OLLAMA:-false}
      - MAPPINGS_DIR=/app/mappings
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - ./mappings:/app/mappings
      - ./src:/app/src
      - ./tests:/app/tests
      - ./unkownlogs:/app/unkownlogs
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 4. Frontend Dashboard (React + Vite)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    image: ulpf-frontend:latest
    container_name: ulpf-frontend
    depends_on:
      - storage-api
      - engine
    ports:
      - "3000:3000"
    environment:
      - STORAGE_API_URL=http://storage-api:8000
      - ENGINE_API_URL=http://engine:8001
    volumes:
      - ./frontend/src:/app/src
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 5. Self-Hosted Ollama AI LLM Engine
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ulpf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 6. Automated Model Puller (phi4-mini & nomic-embed-text)
  # -------------------------------------------------------------
  ollama-pull:
    image: curlimages/curl:latest
    container_name: ulpf-ollama-pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
      echo 'Waiting for Ollama container to start...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      if curl -s http://ollama:11434/api/tags | grep -q 'phi4-mini'; then
        echo 'phi4-mini model already present, skipping download.';
      else
        echo 'Pulling phi4-mini reasoning model (initial download)...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"phi4-mini\"}';
      fi;
      if curl -s http://ollama:11434/api/tags | grep -q 'nomic-embed-text'; then
        echo 'nomic-embed-text model already present, skipping download.';
      else
        echo 'Pulling nomic-embed-text embedding model (initial download)...';
        curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}';
      fi;
      echo 'All Ollama models downloaded and ready!';
      "
    restart: "no"
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 7. RAG Chatbot Service (Interactive / LangGraph)
  # -------------------------------------------------------------
  rag-chatbot:
    build:
      context: ./rag_chatbots
    image: ulpf-rag-chatbot:latest
    container_name: ulpf-rag-chatbot
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rag_chatbots/documents:/app/documents
      - ./rag_chatbots/vectorstore:/app/vectorstore
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 8. Anomaly Detection Analytics Engine (Job / CLI)
  # -------------------------------------------------------------
  anomaly-detection:
    build:
      context: ./anomaly_detection
    image: ulpf-anomaly-detection:latest
    container_name: ulpf-anomaly-detection
    volumes:
      - .:/data
    networks:
      - ulpf-network

  # -------------------------------------------------------------
  # 9. Mappings Schema Validator & Tester
  # -------------------------------------------------------------
  mappings-validator:
    build:
      context: .
      dockerfile: mappings/Dockerfile
    image: ulpf-mappings-validator:latest
    container_name: ulpf-mappings-validator
    volumes:
      - ./mappings:/app/mappings
    networks:
      - ulpf-network

# ---------------------------------------------------------------
# Unified Network & Shared Volumes
# ---------------------------------------------------------------
networks:
  ulpf-network:
    name: ulpf-network
    driver: bridge

volumes:
  opensearch-data:
  ollama-data:

